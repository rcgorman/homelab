---
- name: Deploy OpenCloud Quadlet
  hosts: apps01.internal.gormantech.com
  become: true
  gather_facts: false
  vars:
    opencloud_source: "{{ playbook_dir }}/../../services/opencloud/quadlets"
    opencloud_quadlet_dir: /etc/containers/systemd

  pre_tasks:
    - name: Require OpenCloud admin password in Vault
      ansible.builtin.assert:
        that:
          - vault_opencloud_admin_password is defined
          - vault_opencloud_admin_password | length > 0
        fail_msg: Add vault_opencloud_admin_password to the shared Vault file.
      no_log: true

    - name: Confirm Podman is installed
      ansible.builtin.command: podman --version
      check_mode: false
      changed_when: false

    - name: Confirm OpenCloud data is mounted
      ansible.builtin.command: mountpoint -q /mnt/opencloud/data
      check_mode: false
      changed_when: false

  tasks:
    - name: Ensure OpenCloud admin password secret exists
      containers.podman.podman_secret:
        name: opencloud_admin_password
        data: "{{ vault_opencloud_admin_password }}"
        state: present
        skip_existing: true
      when: not ansible_check_mode
      no_log: true
      notify: Restart OpenCloud

    - name: Create Quadlet directory
      ansible.builtin.file:
        path: "{{ opencloud_quadlet_dir }}"
        state: directory
        mode: "0755"

    - name: Install OpenCloud network Quadlet
      ansible.builtin.copy:
        src: "{{ opencloud_source }}/opencloud.network"
        dest: "{{ opencloud_quadlet_dir }}/opencloud.network"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart OpenCloud

    - name: Install OpenCloud configuration volume Quadlet
      ansible.builtin.copy:
        src: "{{ opencloud_source }}/opencloud-config.volume"
        dest: "{{ opencloud_quadlet_dir }}/opencloud-config.volume"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart OpenCloud

    - name: Install OpenCloud container Quadlet
      ansible.builtin.copy:
        src: "{{ opencloud_source }}/opencloud.container"
        dest: "{{ opencloud_quadlet_dir }}/opencloud.container"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart OpenCloud

    - name: Apply changed OpenCloud files
      ansible.builtin.meta: flush_handlers

    - name: Start OpenCloud service
      ansible.builtin.systemd_service:
        name: opencloud.service
        state: started
      when: not ansible_check_mode

    - name: Collect service states
      ansible.builtin.service_facts:
      when: not ansible_check_mode

    - name: Verify OpenCloud is active
      ansible.builtin.assert:
        that:
          - ansible_facts.services['opencloud.service'].state == 'running'
      when: not ansible_check_mode

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: not ansible_check_mode

    - name: Restart OpenCloud
      ansible.builtin.systemd_service:
        name: opencloud.service
        state: restarted
      when: not ansible_check_mode
